services:
  mysql:
    image: mysql:8.4
    #This local assignment database does not need replication binary logs.
    command: ["--skip-log-bin"]
    environment:
      MYSQL_DATABASE: ex2_db
      MYSQL_USER: jonhbrae
      MYSQL_PASSWORD: porto_local_only
      MYSQL_ROOT_PASSWORD: porto_root_local_only
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
